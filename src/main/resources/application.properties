spring.application.name=weather-insights
spring.datasource.url=jdbc:postgresql://localhost:5432/weather
spring.datasource.username=weather
spring.datasource.password=weather
spring.jpa.hibernate.ddl-auto=validate
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Override in deploy via env WEATHER_ADMIN_TOKEN (Spring relaxed binding).
# Do not use ${WEATHER_ADMIN_TOKEN:...} here — that name aliases this property and loops.
weather.admin.token=dev-admin-token